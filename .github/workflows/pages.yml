name: Site and web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      # Landing page at the root, the web app next to it at app/ (it uses relative paths).
      - run: pnpm -C apps/site build
        env: { PAGES_BASE_PATH: '${{ steps.pages.outputs.base_path }}', SITE_URL: '${{ steps.pages.outputs.base_url }}', NEXT_TELEMETRY_DISABLED: '1' }
      - run: pnpm -C apps/web build && cp -R apps/web/dist apps/site/out/app
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/site/out }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
