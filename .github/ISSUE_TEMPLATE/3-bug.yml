name: App, extension or website bug
description: Something in the desktop app, web app, browser extension or website does not work.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Desktop app, Web app, Browser extension, Website]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, OS and browser
      placeholder: 0.1.0 on Windows 11, Chrome 141
