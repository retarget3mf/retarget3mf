<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Convert · Retarget3MF</title>
    <style>
      :root { color-scheme: light dark; font: 15px/1.5 system-ui, sans-serif; --muted: GrayText; --accent: #1f6feb; --ok: #1a7f37; --bad: #b42318; --line: color-mix(in srgb, CanvasText 15%, transparent); }
      body { margin: 0; background: Canvas; color: CanvasText; }
      main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .muted { color: var(--muted); }
      section { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
      label { display: block; font-weight: 600; margin: 12px 0 4px; }
      select { width: 100%; padding: 8px; font: inherit; border-radius: 8px; }
      button, a.button { display: inline-block; margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; font: 600 15px system-ui; background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; }
      button:disabled { opacity: 0.5; cursor: default; }
      [role=alert] { color: var(--bad); font-weight: 600; }
      ul.warnings { padding-left: 20px; } ul.warnings li { margin: 4px 0; }
      table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
      th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
      .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1px solid var(--line); }
      .done { color: var(--ok); font-weight: 600; }
      .brand { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
      .accent { color: #0b66d0; } @media (prefers-color-scheme: dark) { .accent { color: #5fa0f2; } .brand img { filter: drop-shadow(0 0 0.75px rgb(255 255 255 / 0.55)); } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand"><img src="/icon/48.png" width="32" height="32" alt="" />Retarget<span class="accent">3MF</span></p>
      <h1>Convert in the browser</h1>
      <p class="muted" id="project"></p>
      <section>
        <label for="printer">Your printer</label>
        <select id="printer"></select>
        <label for="slicer">Your slicer</label>
        <select id="slicer"></select>
        <button id="convert" type="button">Convert</button>
        <p id="status" role="status" class="muted"></p>
        <p id="error" role="alert" hidden></p>
      </section>
      <section id="result" hidden>
        <p class="done" id="summary"></p>
        <a class="button" id="download" download>Download</a>
        <p class="muted" id="howto"></p>
        <ul class="warnings" id="warnings"></ul>
        <table id="filaments"><thead><tr><th>Colour</th><th>Slot</th><th>Type</th><th>Preset</th></tr></thead><tbody></tbody></table>
      </section>
      <p class="muted">Everything runs on this computer. The Retarget3MF desktop app does the same in one click and opens your slicer.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
