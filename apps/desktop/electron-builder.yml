# Main, preload and renderer are fully bundled into out/, so no node_modules ship.
appId: app.retarget3mf.desktop
productName: Retarget3MF
directories:
  output: dist
files:
  - out/**
  - package.json
# The native messaging host runs under plain Node, which cannot read inside app.asar.
asarUnpack:
  - out/main/host.js
  - out/main/chunks/**
fileAssociations:
  # Registered as an alternative handler: never takes over .3mf from the user's slicer without asking.
  - ext: 3mf
    name: 3MF Project
    description: 3D printing project
    mimeType: model/3mf
    role: Viewer
    rank: Alternate
# Fallback hand-off from the browser extension when its native messaging host is unreachable.
protocols:
  - name: Retarget3MF link
    schemes: [retarget3mf]
mac:
  # Universal: one download for Apple silicon and Intel; the zip is what auto-update uses.
  target:
    - { target: dmg, arch: [universal] }
    - { target: zip, arch: [universal] }
  category: public.app-category.productivity
  icon: build/icon.icns
  # macOS only lets an app take a link scheme it declares. The slicer schemes stay with the slicers unless the
  # "Catch Open in slicer buttons" setting is on; links that arrive while it is off are passed on (slicerLinks.ts).
  protocols:
    - name: Retarget3MF link
      schemes: [retarget3mf]
    - name: Model site slicer links
      schemes: [bambustudio, bambustudioopen, bambusuite, crealityprintlink, snapmaker-orca, prusaslicer]
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
linux:
  target: [AppImage, deb]
  executableName: retarget3mf
  icon: build/icons
  category: Graphics
  mimeTypes: [model/3mf]
deb:
  artifactName: Retarget3MF_${version}_${arch}.${ext}
